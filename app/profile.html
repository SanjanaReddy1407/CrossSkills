<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Profile — CrossSkill</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/app-shell.css">
<link rel="stylesheet" href="../css/setup.css">
</head>
<body>
<div class="grain"></div>
<div id="toast"><span class="dot"></span><span id="toast-msg"></span></div>

<div class="app-shell">
  <aside class="rail" id="rail"></aside>
  <main class="main">
    <div class="page-head">
      <div><h1>Profile & settings</h1><div class="desc">Your public exchange listing.</div></div>
    </div>

    <div class="profile-top">
      <div class="profile-avatar" id="profile-avatar"></div>
      <div>
        <h2 style="font-size:22px;" id="profile-name"></h2>
        <div style="color:var(--ink-70); font-size:13.5px; margin-top:2px;" id="profile-meta"></div>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat"><b id="stat-rating"></b><span>Avg rating</span></div>
      <div class="stat"><b id="stat-reviews"></b><span>Reviews received</span></div>
      <div class="stat"><b id="stat-connections"></b><span>Active connections</span></div>
    </div>
    <hr class="hairline" style="margin-bottom:26px;">

    <div class="skill-block">
      <h3>What I can teach</h3><div class="sub">Editable offered-skill catalog.</div>
      <div class="skill-form-grid">
        <div class="field" style="margin:0;"><label>Skill</label><input id="off-skill" placeholder="e.g. Python"></div>
        <div class="field" style="margin:0;"><label>Category</label><select id="off-cat"><option>Programming</option><option>Web Development</option><option>Data Science</option><option>Design</option><option>Communication</option><option>Marketing</option></select></div>
        <div class="field" style="margin:0;"><label>Level</label><select id="off-lvl"><option>Beginner</option><option>Intermediate</option><option selected>Advanced</option></select></div>
        <button class="btn btn-outline btn-sm" onclick="addSkill('offered')">Add</button>
      </div>
      <div class="chip-list" id="offered-chips"></div>
    </div>

    <div class="skill-block">
      <h3>What I want to learn</h3><div class="sub">Editable desired-skill catalog.</div>
      <div class="skill-form-grid">
        <div class="field" style="margin:0;"><label>Skill</label><input id="des-skill" placeholder="e.g. React"></div>
        <div class="field" style="margin:0;"><label>Category</label><select id="des-cat"><option>Programming</option><option selected>Web Development</option><option>Data Science</option><option>Design</option><option>Communication</option><option>Marketing</option></select></div>
        <div class="field" style="margin:0;"><label>Target level</label><select id="des-lvl"><option>Beginner</option><option selected>Intermediate</option><option>Advanced</option></select></div>
        <button class="btn btn-outline btn-sm" onclick="addSkill('desired')">Add</button>
      </div>
      <div class="chip-list" id="desired-chips"></div>
    </div>

    <button class="btn btn-outline" onclick="logout()">Log out</button>
  </main>
</div>

<script src="../js/store.js"></script>
<script src="../js/toast.js"></script>
<script src="../js/nav.js"></script>
<script src="../js/profile.js"></script>
</body>
</html>
